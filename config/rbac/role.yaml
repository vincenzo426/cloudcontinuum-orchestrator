---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch  // <-- AGGIUNGI QUESTA RIGA
- apiGroups:
  - orchestrator.cloudcontinuum.io
  resources:
  - pipelineplacementrequests
  - placementrequests
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - orchestrator.cloudcontinuum.io
  resources:
  - pipelineplacementrequests/finalizers
  - placementrequests/finalizers
  verbs:
  - update
- apiGroups:
  - orchestrator.cloudcontinuum.io
  resources:
  - pipelineplacementrequests/status
  - placementrequests/status
  verbs:
  - get
  - patch
  - update
