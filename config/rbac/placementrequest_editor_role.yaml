# This rule is not used by the project cloudcontinuum-orchestrator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the orchestrator.cloudcontinuum.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cloudcontinuum-orchestrator
    app.kubernetes.io/managed-by: kustomize
  name: placementrequest-editor-role
rules:
- apiGroups:
  - orchestrator.cloudcontinuum.io
  resources:
  - placementrequests
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - orchestrator.cloudcontinuum.io
  resources:
  - placementrequests/status
  verbs:
  - get
