# Prometheus ServiceMonitor per il controller CloudContinuum
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudcontinuum-controller-metrics
  namespace: monitoring  # IMPORTANTE: stesso namespace di Prometheus
  labels:
    app.kubernetes.io/name: cloudcontinuum-orchestrator
    release: prometheus-stack  # Label per essere scoperto da Prometheus
spec:
  namespaceSelector:
    matchNames:
      - cloudcontinuum-orchestrator-system
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cloudcontinuum-orchestrator
  endpoints:
    - port: https
      path: /metrics
      scheme: https
      interval: 15s  # Scrape ogni 15 secondi
      scrapeTimeout: 10s
      tlsConfig:
        insecureSkipVerify: true  # Per sviluppo, in prod usa cert-manager
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token